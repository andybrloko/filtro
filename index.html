<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Questões ENEM Matemática</title>
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }

    h1, h3 {
      text-align: center;
    }

    .secao-filtros {
      margin: 20px;
    }

    .secao-filtros h3 {
      margin-bottom: 10px;
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .filtro {
      background: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      user-select: none;
    }

    #container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .questao {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .questao img {
      max-width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<h1>Questões de Matemática – ENEM</h1>

<div class="secao-filtros">
  <h3>Filtrar por conteúdo</h3>
  <div id="filtrosConteudo" class="filtros"></div>
</div>

<div class="secao-filtros">
  <h3>Filtrar por ano</h3>
  <div id="filtrosAno" class="filtros"></div>
</div>

<hr>

<div id="container"></div>

<script>
let questoes = [];

// =======================
// CATEGORIA PRINCIPAL
// =======================
function categoriaPrincipal(texto) {
  texto = texto.toLowerCase();

  if (texto.includes("estatística")) return "Estatística";
  if (texto.includes("função afim") || texto.includes("1º grau")) return "Função Afim";
  if (texto.includes("função quadrática") || texto.includes("2º grau")) return "Função Quadrática";
  if (texto.includes("trigonometr")) return "Trigonometria";
  if (texto.includes("geometria analítica")) return "Geometria Analítica";
  if (texto.includes("geometria espacial")) return "Geometria Espacial";
  if (texto.includes("probabilidade") || texto.includes("combinatória")) return "Probabilidade";
  if (texto.includes("escala") || texto.includes("proporção")) return "Escala e Proporção";
  if (texto.includes("exponencial")) return "Função Exponencial";
  if (texto.includes("logarítmica")) return "Função Logarítmica";

  return "Outros";
}

fetch("questoes.csv")
  .then(r => r.text())
  .then(csv => {
    const linhas = csv.trim().split("\n").slice(1);

    const filtrosConteudo = document.getElementById("filtrosConteudo");
    const filtrosAno = document.getElementById("filtrosAno");
    const container = document.getElementById("container");

    const categorias = new Set();
    const anos = new Set();

    linhas.forEach(linha => {
      const [ano, num, conteudos, gabarito] = linha.split(";");
      if (!ano || !num) return;

      const categoria = categoriaPrincipal(conteudos);

      questoes.push({
        ano,
        num,
        conteudos,
        gabarito,
        categoria
      });

      categorias.add(categoria);
      anos.add(ano);
    });

    // =======================
    // FILTROS DE CONTEÚDO
    // =======================
    [...categorias].sort().forEach(cat => {
      filtrosConteudo.appendChild(criarCheckbox(cat, aplicarFiltro));
    });

    // =======================
    // FILTROS DE ANO
    // =======================
    [...anos].sort((a, b) => b - a).forEach(ano => {
      filtrosAno.appendChild(criarCheckbox(ano, aplicarFiltro));
    });

    renderizar(questoes);

    function criarCheckbox(valor, onChange) {
      const label = document.createElement("label");
      label.className = "filtro";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.value = valor;
      checkbox.addEventListener("change", onChange);

      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(" " + valor));

      return label;
    }

    function aplicarFiltro() {
      const conteudosSelecionados = [...document.querySelectorAll("#filtrosConteudo input:checked")]
        .map(cb => cb.value);

      const anosSelecionados = [...document.querySelectorAll("#filtrosAno input:checked")]
        .map(cb => cb.value);

      const filtradas = questoes.filter(q => {
        const okConteudo =
          conteudosSelecionados.length === 0 ||
          conteudosSelecionados.includes(q.categoria);

        const okAno =
          anosSelecionados.length === 0 ||
          anosSelecionados.includes(q.ano);

        return okConteudo && okAno;
      });

      renderizar(filtradas);
    }

    function renderizar(lista) {
      container.innerHTML = "";

      lista.forEach(q => {
        const div = document.createElement("div");
        div.className = "questao";

        div.innerHTML = `
          <h3>${q.ano} – Questão ${q.num}</h3>
          <img src="imagens/${q.ano}_q${q.num}.png">
          <p><strong>Categoria:</strong> ${q.categoria}</p>
          <p><strong>Gabarito:</strong> ${q.gabarito}</p>
        `;

        container.appendChild(div);
      });
    }
  });
</script>

</body>
</html>
