<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Questões ENEM Matemática</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
}

h1, h3 { text-align: center; }

.topo {
  text-align:center;
  padding: 10px;
}

button {
  cursor: pointer;
}

#btnSimulado {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  background: #2e7d32;
  color: #fff;
  font-weight: bold;
}

#btnSimulado:hover { background:#1b5e20; }

#pesquisa {
  width: 240px;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  display: block;
  margin: 10px auto 20px auto;
}

.filtros {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

.filtro {
  background: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

#container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  padding: 20px;
}

.questao {
  background: #fff;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.questao img {
  max-width: 100%;
  border-radius: 8px;
  margin: 10px 0;
}

.opcoes button {
  display:block;
  width:100%;
  margin:4px 0;
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
  background:#fafafa;
}

.resultado {
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin:20px;
}
</style>
</head>

<body>

<h1>Questões de Matemática – ENEM</h1>
<h3> > By Andy and Bruno < </h3>

<div class="topo">
  <button id="btnSimulado">🎲 Simulado (10 aleatórias)</button>
</div>

<input type="text" id="pesquisa" placeholder="Pesquisar: ex 2018 45">

<div class="filtros" id="filtrosConteudo"></div>
<div class="filtros" id="filtrosAno"></div>

<div id="container"></div>

<script>
let questoes = [];
let termoPesquisa = "";
let simulado = [];
let indiceAtual = 0;
let acertos = 0;

// =======================
// CATEGORIA
// =======================
function categoriaPrincipal(texto) {
  texto = texto.toLowerCase();
  if (texto.includes("estatística")) return "Estatística";
  if (texto.includes("função")) return "Funções";
  if (texto.includes("trigonometr")) return "Trigonometria";
  if (texto.includes("geometria")) return "Geometria";
  if (texto.includes("probabilidade")) return "Probabilidade";
  return "Outros";
}

// =======================
// CSV
// =======================
fetch("questoes.csv")
.then(r => r.text())
.then(csv => {
  const linhas = csv.trim().split("\n").slice(1);

  const cats = new Set();
  const anos = new Set();

  linhas.forEach(l => {
    const [ano,num,conteudos,gabarito] = l.split(";");
    const categoria = categoriaPrincipal(conteudos);
    questoes.push({ano,num,conteudos,gabarito,categoria});
    cats.add(categoria);
    anos.add(ano);
  });

  renderizar(questoes);

  document.getElementById("btnSimulado").onclick = iniciarSimulado;
});

// =======================
// LISTAGEM NORMAL
// =======================
function renderizar(lista) {
  const c = document.getElementById("container");
  c.innerHTML = "";

  lista.forEach(q => {
    c.innerHTML += `
      <div class="questao">
        <h3>${q.ano} – Questão ${q.num}</h3>
        <img src="imagens/${q.ano}_q${q.num}.png">
        <p><b>Categoria:</b> ${q.categoria}</p>
        <p><b>Gabarito:</b> ${q.gabarito}</p>
      </div>`;
  });
}

// =======================
// SIMULADO
// =======================
function iniciarSimulado() {
  simulado = [...questoes]
    .sort(() => Math.random() - 0.5)
    .slice(0,10);

  indiceAtual = 0;
  acertos = 0;
  mostrarQuestaoSimulado();
}

function mostrarQuestaoSimulado() {
  const q = simulado[indiceAtual];
  const c = document.getElementById("container");

  c.innerHTML = `
  <div class="questao">
    <h3>Questão ${indiceAtual+1} de 10</h3>
    <p><b>${q.ano} – Questão ${q.num}</b></p>
    <p><b>Categoria:</b> ${q.categoria}</p>

    <img src="imagens/${q.ano}_q${q.num}.png">

    <div class="opcoes">
      ${["A","B","C","D","E"].map(l =>
        `<button onclick="responder('${l}')">${l}</button>`
      ).join("")}
    </div>
  </div>`;
}

function responder(letra) {
  const q = simulado[indiceAtual];
  if (letra === q.gabarito.trim()) acertos++;

  indiceAtual++;

  if (indiceAtual >= simulado.length) {
    mostrarResultado();
  } else {
    mostrarQuestaoSimulado();
  }
}

function mostrarResultado() {
  document.getElementById("container").innerHTML =
    `<div class="resultado">
      Você acertou ${acertos} de 10 questões
     </div>`;
}
</script>

</body>
</html>
