<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Questões ENEM Matemática</title>
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: #eaeaea;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      border-bottom: 1px solid #2a2a2a;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin-top: 8px;
      color: #aaa;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .filtros {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .filtros h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 18px;
    }

    #filtros label {
      display: inline-flex;
      align-items: center;
      margin-right: 15px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    #filtros input {
      margin-right: 6px;
      accent-color: #4caf50;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .questao {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
    }

    .questao h3 {
      margin-top: 0;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .questao img {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .questao p {
      margin: 4px 0;
      font-size: 14px;
      color: #ccc;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>Questões de Matemática – ENEM</h1>
  <p>2009 a 2025 • Filtro por conteúdos</p>
</header>

<main>
  <div class="filtros">
    <h3>Filtrar por conteúdos</h3>
    <div id="filtros"></div>
  </div>

  <div id="container" class="grid">
    Carregando questões...
  </div>
</main>

<footer>
  © ENEM Matemática • Projeto pessoal
</footer>

<script>
let questoes = [];

// =======================
// NORMALIZA TEXTO
// =======================
function normalizar(txt) {
  return txt
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\(.*?\)/g, "")
    .replace(/[-–—].*/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

fetch("questoes.csv")
  .then(r => r.text())
  .then(csv => {
    const linhas = csv.trim().split("\n").slice(1);
    const container = document.getElementById("container");
    const filtrosDiv = document.getElementById("filtros");

    const mapaFiltros = new Map();

    linhas.forEach(linha => {
      const [ano, num, conteudosRaw, gabarito] = linha.split(";");
      if (!ano || !num || !conteudosRaw) return;

      const conteudos = conteudosRaw.split("|").map(c => c.trim());

      questoes.push({ ano, num, conteudos, gabarito });

      conteudos.forEach(c => {
        const chave = normalizar(c);
        if (!mapaFiltros.has(chave)) {
          mapaFiltros.set(chave, c);
        }
      });
    });

    // =======================
    // CRIA FILTROS LIMPOS
    // =======================
    [...mapaFiltros.entries()]
      .sort((a, b) => a[1].localeCompare(b[1]))
      .forEach(([chave, texto]) => {
        const label = document.createElement("label");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = chave;
        checkbox.addEventListener("change", aplicarFiltro);

        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(" " + texto));

        filtrosDiv.appendChild(label);
      });

    renderizar(questoes);

    // =======================
    // FILTRAGEM
    // =======================
    function aplicarFiltro() {
      const selecionados = [...document.querySelectorAll("#filtros input:checked")]
        .map(cb => cb.value);

      if (selecionados.length === 0) {
        renderizar(questoes);
        return;
      }

      const filtradas = questoes.filter(q =>
        q.conteudos.some(c =>
          selecionados.includes(normalizar(c))
        )
      );

      renderizar(filtradas);
    }

    // =======================
    // RENDER
    // =======================
    function renderizar(lista) {
      container.innerHTML = "";

      lista.forEach(q => {
        const div = document.createElement("div");
        div.className = "questao";

        div.innerHTML = `
          <h3>${q.ano} – Questão ${q.num}</h3>
          <img src="imagens/${q.ano}_q${q.num}.png" alt="Questão ${q.num}">
          <p><strong>Conteúdos:</strong> ${q.conteudos.join(", ")}</p>
          <p><strong>Gabarito:</strong> ${q.gabarito}</p>
        `;

        container.appendChild(div);
      });
    }
  });
</script>

</body>
</html>
