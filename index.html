<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Filtro de Questões</title>

<style>
body {
    background: #121212;
    color: #e0e0e0;
    font-family: Arial, sans-serif;
    padding: 20px;
}

h1 {
    margin-bottom: 10px;
}

.filtros {
    background: #1e1e1e;
    padding: 15px;
    border-radius: 8px;
    max-width: 400px;
    margin-bottom: 20px;
}

.filtros h3 {
    margin-bottom: 10px;
}

.filtros label {
    display: block;
    margin-bottom: 6px;
    cursor: pointer;
}

.lista {
    background: #1a1a1a;
    padding: 15px;
    border-radius: 8px;
}

.questao {
    padding: 8px;
    border-bottom: 1px solid #333;
}
</style>
</head>

<body>

<h1>Questões</h1>

<div class="filtros">
    <h3>Conteúdos</h3>
    <div id="filtros-conteudos"></div>
</div>

<div class="lista" id="lista-questoes">
    Carregando questões...
</div>

<script>
let questoes = [];

fetch("questoes.csv")
    .then(res => res.text())
    .then(texto => {
        questoes = csvParaObjetos(texto);
        criarFiltros();
        renderizar(questoes);
    });

function csvParaObjetos(csv) {
    const linhas = csv.trim().split("\n");
    const cabecalho = linhas.shift().split(",");

    return linhas.map(linha => {
        const valores = linha.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)
            .map(v => v.replace(/"/g, ""));

        const obj = {};
        cabecalho.forEach((chave, i) => {
            if (chave === "conteudos") {
                obj[chave] = valores[i].split(";");
            } else {
                obj[chave] = valores[i];
            }
        });
        return obj;
    });
}

function criarFiltros() {
    const todosConteudos = new Set();

    questoes.forEach(q =>
        q.conteudos.forEach(c => todosConteudos.add(c))
    );

    const container = document.getElementById("filtros-conteudos");

    [...todosConteudos].sort().forEach(conteudo => {
        const label = document.createElement("label");
        label.innerHTML = `
            <input type="checkbox" value="${conteudo}">
            ${conteudo}
        `;
        container.appendChild(label);
    });

    container.addEventListener("change", aplicarFiltros);
}

function aplicarFiltros() {
    const selecionados = [...document.querySelectorAll(
        "#filtros-conteudos input:checked"
    )].map(i => i.value);

    if (selecionados.length === 0) {
        renderizar(questoes);
        return;
    }

    const filtradas = questoes.filter(q =>
        selecionados.every(s => q.conteudos.includes(s))
    );

    renderizar(filtradas);
}

function renderizar(lista) {
    const div = document.getElementById("lista-questoes");
    div.innerHTML = "";

    if (lista.length === 0) {
        div.textContent = "Nenhuma questão encontrada.";
        return;
    }

    lista.forEach(q => {
        const el = document.createElement("div");
        el.className = "questao";
        el.textContent =
            `Ano ${q.ano} | Nº ${q.numero} | Conteúdos: ${q.conteudos.join(", ")} | Gabarito: ${q.gabarito}`;
        div.appendChild(el);
    });
}
</script>

</body>
</html>
