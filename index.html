<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Questões ENEM Matemática</title>
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }

    h1 {
      text-align: center;
      margin: 20px 0 10px;
    }

    .barra {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 20px;
    }

    .bloco {
      background: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .bloco h3 {
      margin-top: 0;
      text-align: center;
    }

    #filtros, #anos {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    label {
      cursor: pointer;
      font-size: 14px;
    }

    input[type="checkbox"] {
      margin-right: 6px;
    }

    #pesquisa {
      width: 240px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    #container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .questao {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .questao img {
      max-width: 100%;
      border-radius: 8px;
      margin: 10px 0;
    }
  </style>
</head>

<body>

<h1>Questões de Matemática – ENEM</h1>

<div class="barra">

  <div class="bloco">
    <h3>Pesquisar</h3>
    <input
      type="text"
      id="pesquisa"
      placeholder="Ex: 2018 45 ou 2012"
    >
  </div>

  <div class="bloco">
    <h3>Anos</h3>
    <div id="anos"></div>
  </div>

  <div class="bloco">
    <h3>Conteúdos</h3>
    <div id="filtros"></div>
  </div>

</div>

<div id="container"></div>

<script>
let questoes = [];
let termoPesquisa = "";

// Buscar CSV
fetch("questoes.csv")
  .then(r => r.text())
  .then(csv => {
    const linhas = csv.trim().split("\n").slice(1);
    const conteudosSet = new Set();
    const anosSet = new Set();

    linhas.forEach(linha => {
      const [ano, num, conteudos, gabarito] = linha.split(";");
      if (!ano || !num) return;

      const listaConteudos = conteudos.split("|").map(c => c.trim());

      questoes.push({ ano, num, conteudos: listaConteudos, gabarito });

      listaConteudos.forEach(c => conteudosSet.add(c));
      anosSet.add(ano);
    });

    criarFiltros([...conteudosSet].sort(), "filtros");
    criarFiltros([...anosSet].sort(), "anos");

    renderizar(questoes);
  });

function criarFiltros(lista, id) {
  const div = document.getElementById(id);
  div.innerHTML = "";

  lista.forEach(item => {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" value="${item}"> ${item}`;
    label.querySelector("input").addEventListener("change", aplicarFiltros);
    div.appendChild(label);
  });
}

document.getElementById("pesquisa").addEventListener("input", e => {
  termoPesquisa = e.target.value.toLowerCase();
  aplicarFiltros();
});

function aplicarFiltros() {
  const filtrosConteudo = [...document.querySelectorAll("#filtros input:checked")].map(i => i.value);
  const filtrosAno = [...document.querySelectorAll("#anos input:checked")].map(i => i.value);

  let filtradas = questoes.filter(q => {
    const correspondeConteudo = filtrosConteudo.length ? q.conteudos.some(c => filtrosConteudo.includes(c)) : true;
    const correspondeAno = filtrosAno.length ? filtrosAno.includes(q.ano) : true;
    const correspondePesquisa = termoPesquisa ? `${q.ano} ${q.num}`.toLowerCase().includes(termoPesquisa) : true;
    return correspondeConteudo && correspondeAno && correspondePesquisa;
  });

  renderizar(filtradas);
}

function renderizar(lista) {
  const container = document.getElementById("container");
  container.innerHTML = "";

  if (!lista.length) {
    container.innerHTML = "<p style='text-align:center'>Nada encontrado.</p>";
    return;
  }

  lista.forEach(q => {
    const div = document.createElement("div");
    div.className = "questao";
    div.innerHTML = `
      <h3>${q.ano} – Questão ${q.num}</h3>
      <img src="imagens/${q.ano}_q${q.num}.png" alt="Questão ${q.num}">
      <p><strong>Conteúdos:</strong> ${q.conteudos.join(", ")}</p>
      <p><strong>Gabarito:</strong> ${q.gabarito}</p>
    `;
    container.appendChild(div);
  });
}
</script>

</body>
</html>
