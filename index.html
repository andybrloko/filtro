<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Questões ENEM Matemática</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    h1, h3 { text-align: center; }

    /* Filtros */
    .secao-filtros { margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .filtros { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .filtro { background: #f0f2f5; padding: 8px 12px; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; font-size: 14px; display: flex; align-items: center; }
    
    #pesquisa { width: 100%; max-width: 400px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; display: block; margin: 0 auto 20px auto; }
    
    /* Grid de Questões */
    #container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

    .questao { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .questao img { max-width: 100%; border-radius: 8px; margin: 10px 0; display: block; }

    .gabarito { filter: blur(6px); transition: filter 0.3s ease; user-select: none; margin: 10px 0; background: #f9f9f9; padding: 5px; border-radius: 4px; }
    .gabarito.mostrar { filter: none; }
    
    .btn-gabarito { padding: 8px 15px; border: none; border-radius: 6px; background: #1976d2; color: #fff; cursor: pointer; font-weight: bold; }
    .btn-gabarito:hover { background: #125aa0; }
  </style>
</head>
<body>

<h1>Questões de Matemática – ENEM</h1>

<input type="text" id="pesquisa" placeholder="Pesquisar (ex: 2022 140)">

<div class="secao-filtros">
  <h3>Filtrar por conteúdo</h3>
  <div id="filtrosConteudo" class="filtros"></div>
</div>

<div class="secao-filtros">
  <h3>Filtrar por ano</h3>
  <div id="filtrosAno" class="filtros"></div>
</div>

<hr>

<div id="container">Carregando questões...</div>

<script>
let todasQuestoes = [];

// Função de Categorização
function categoriaPrincipal(texto) {
  if (!texto) return "Outros";
  texto = texto.toLowerCase();
  if (texto.includes("estatística")) return "Estatística";
  if (texto.includes("afim") || texto.includes("1º grau")) return "Função Afim";
  if (texto.includes("quadrática") || texto.includes("2º grau")) return "Função Quadrática";
  if (texto.includes("trigonometr")) return "Trigonometria";
  if (texto.includes("analítica")) return "Geometria Analítica";
  if (texto.includes("espacial")) return "Geometria Espacial";
  if (texto.includes("probabilidade") || texto.includes("combinatória")) return "Probabilidade";
  if (texto.includes("escala") || texto.includes("proporção")) return "Escala e Proporção";
  if (texto.includes("exponencial")) return "Função Exponencial";
  if (texto.includes("logarítmica")) return "Função Logarítmica";
  return "Outros";
}

// Carregar CSV
fetch("questoes.csv")
  .then(response => response.text())
  .then(data => {
    const linhas = data.trim().split("\n").slice(1);
    const catSet = new Set();
    const anoSet = new Set();

    todasQuestoes = linhas.map(linha => {
      const col = linha.split(";");
      if (col.length < 4) return null;
      
      const q = {
        ano: col[0].trim(),
        num: col[1].trim(),
        conteudos: col[2].trim(),
        gabarito: col[3].trim().toUpperCase(),
        categoria: categoriaPrincipal(col[2])
      };
      
      catSet.add(q.categoria);
      anoSet.add(q.ano);
      return q;
    }).filter(q => q !== null);

    // Gerar Checkboxes de Filtro
    const fConteudo = document.getElementById("filtrosConteudo");
    const fAno = document.getElementById("filtrosAno");

    [...catSet].sort().forEach(cat => fConteudo.appendChild(criarCheckbox(cat, 'categoria')));
    [...anoSet].sort((a,b) => b - a).forEach(ano => fAno.appendChild(criarCheckbox(ano, 'ano')));

    // Ativar Pesquisa
    document.getElementById("pesquisa").addEventListener("input", aplicarFiltros);

    // Renderização Inicial
    renderizar(todasQuestoes);
  })
  .catch(err => {
    document.getElementById("container").innerHTML = "Erro ao carregar arquivo CSV.";
    console.error(err);
  });

function criarCheckbox(valor, tipo) {
  const label = document.createElement("label");
  label.className = "filtro";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.value = valor;
  cb.className = "filtro-check";
  cb.addEventListener("change", aplicarFiltros);
  label.appendChild(cb);
  label.appendChild(document.createTextNode(" " + valor));
  return label;
}

function aplicarFiltros() {
  const termo = document.getElementById("pesquisa").value.toLowerCase();
  
  // Captura quais categorias estão marcadas
  const catsMarcadas = [...document.querySelectorAll("#filtrosConteudo input:checked")].map(i => i.value);
  const anosMarcados = [...document.querySelectorAll("#filtrosAno input:checked")].map(i => i.value);

  const filtradas = todasQuestoes.filter(q => {
    const matchTermo = (q.ano + " " + q.num).toLowerCase().includes(termo);
    const matchCat = catsMarcadas.length === 0 || catsMarcadas.includes(q.categoria);
    const matchAno = anosMarcados.length === 0 || anosMarcados.includes(q.ano);
    return matchTermo && matchCat && matchAno;
  });

  renderizar(filtradas);
}

function renderizar(lista) {
  const container = document.getElementById("container");
  container.innerHTML = "";
  
  if (lista.length === 0) {
    container.innerHTML = "<p>Nenhuma questão encontrada.</p>";
    return;
  }

  lista.forEach((q, i) => {
    const item = document.createElement("div");
    item.className = "questao";
    item.innerHTML = `
      <h3>${q.ano} – Questão ${q.num}</h3>
      <p><strong>Tipo:</strong> ${q.categoria}</p>
      <img src="imagens/${q.ano}_q${q.num}.png" onerror="this.onerror=null; this.src='imagens/${q.ano}_q${q.num}.PNG';">
      <p class="gabarito" id="gab_${i}"><strong>Gabarito:</strong> ${q.gabarito}</p>
      <button class="btn-gabarito" onclick="document.getElementById('gab_${i}').classList.add('mostrar'); this.style.display='none'">Mostrar Gabarito</button>
    `;
    container.appendChild(item);
  });
}
</script>
</body>
</html>
