<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Filtro de Questões</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #eee;
            padding: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        button {
            padding: 10px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }

        .filtros {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            max-width: 400px;
        }

        .filtros h3 {
            margin-bottom: 10px;
        }

        .filtros label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .filtros input {
            margin-right: 8px;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 6px;
            max-width: 600px;
        }

        .questao {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>

<body>

<h1>Filtro de Questões</h1>

<div class="filtros">
    <h3>Conteúdos</h3>

    <label><input type="checkbox" value="razão"> Razão</label>
    <label><input type="checkbox" value="proporção"> Proporção</label>
    <label><input type="checkbox" value="porcentagem"> Porcentagem</label>
    <label><input type="checkbox" value="estatística"> Estatística</label>
    <label><input type="checkbox" value="geometria"> Geometria</label>
    <label><input type="checkbox" value="função"> Função</label>
    <label><input type="checkbox" value="trigonometria"> Trigonometria</label>
    <label><input type="checkbox" value="probabilidade"> Probabilidade</label>
    <label><input type="checkbox" value="multiplicação"> Multiplicação</label>
</div>

<button onclick="filtrar()">Filtrar</button>

<div id="resultado"></div>

<script>
const questoes = [
    {
        ano: 2009,
        numero: 136,
        conteudos: ["razão", "proporção"],
        gabarito: "E"
    },
    {
        ano: 2009,
        numero: 140,
        conteudos: ["porcentagem", "proporção"],
        gabarito: "D"
    },
    {
        ano: 2010,
        numero: 141,
        conteudos: ["estatística"],
        gabarito: "B"
    },
    {
        ano: 2011,
        numero: 157,
        conteudos: ["geometria", "trigonometria"],
        gabarito: "B"
    },
    {
        ano: 2018,
        numero: 151,
        conteudos: ["probabilidade", "estatística", "multiplicação"],
        gabarito: "C"
    }
];

function filtrar() {
    const checkboxes = document.querySelectorAll('.filtros input:checked');
    const selecionados = Array.from(checkboxes).map(c => c.value);
    const resultado = document.getElementById("resultado");

    resultado.innerHTML = "";

    if (selecionados.length === 0) {
        resultado.innerHTML = "Selecione ao menos um conteúdo.";
        return;
    }

    const filtradas = questoes.filter(q =>
        selecionados.every(c => q.conteudos.includes(c))
    );

    if (filtradas.length === 0) {
        resultado.innerHTML = "Nenhuma questão encontrada.";
        return;
    }

    filtradas.forEach(q => {
        resultado.innerHTML += `
            <div class="questao">
                <strong>${q.ano} - Questão ${q.numero}</strong><br>
                Conteúdos: ${q.conteudos.join(", ")}<br>
                Gabarito: <strong>${q.gabarito}</strong>
            </div>
        `;
    });
}
</script>

</body>
</html>
