<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Filtro de Questões</title>

<style>
body {
    background: #121212;
    color: #e0e0e0;
    font-family: Arial, sans-serif;
    padding: 20px;
}

h1 {
    margin-bottom: 10px;
}

.filtros {
    background: #1e1e1e;
    padding: 15px;
    border-radius: 8px;
    max-width: 400px;
    margin-bottom: 20px;
}

.filtros h3 {
    margin-bottom: 10px;
}

.filtros label {
    display: block;
    margin-bottom: 6px;
    cursor: pointer;
}

.lista {
    background: #1a1a1a;
    padding: 15px;
    border-radius: 8px;
}

.questao {
    padding: 8px;
    border-bottom: 1px solid #333;
}
</style>
</head>

<body>

<h1>Questões</h1>

<div class="filtros">
    <h3>Conteúdos</h3>
    <div id="filtros-conteudos"></div>
</div>

<div class="lista" id="lista-questoes">
    Carregando questões...
</div>

<script>
let questoes = [];

fetch("questoes.csv")
  .then(res => {
    if (!res.ok) throw new Error("Erro ao carregar CSV");
    return res.text();
  })
  .then(texto => {
    questoes = parseCSV(texto);
    criarFiltros();
    renderizar(questoes);
    console.log("Questões carregadas:", questoes);
  })
  .catch(console.error);

function parseCSV(csv) {
  const linhas = csv.trim().split("\n");
  const cabecalho = linhas.shift().split(",");

  return linhas.map(linha => {
    // regex decente pra CSV
    const valores = linha.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)
      .map(v => v.replace(/"/g, "").trim());

    let obj = {};
    cabecalho.forEach((col, i) => {
      if (col === "conteudos") {
        obj[col] = valores[i]
          .split("|")
          .map(c => c.trim().toLowerCase());
      } else {
        obj[col] = valores[i];
      }
    });
    return obj;
  });
}

function criarFiltros() {
  const set = new Set();

  questoes.forEach(q =>
    q.conteudos.forEach(c => set.add(c))
  );

  const container = document.getElementById("filtros-conteudos");
  container.innerHTML = "";

  [...set].sort().forEach(conteudo => {
    const label = document.createElement("label");
    label.innerHTML = `
      <input type="checkbox" value="${conteudo}">
      ${conteudo}
    `;
    container.appendChild(label);
  });

  container.addEventListener("change", aplicarFiltros);
}

function aplicarFiltros() {
  const ativos = [...document.querySelectorAll(
    "#filtros-conteudos input:checked"
  )].map(i => i.value);

  if (ativos.length === 0) {
    renderizar(questoes);
    return;
  }

  const filtradas = questoes.filter(q =>
    ativos.every(a => q.conteudos.includes(a))
  );

  renderizar(filtradas);
}

function renderizar(lista) {
  const div = document.getElementById("lista-questoes");
  div.innerHTML = "";

  if (lista.length === 0) {
    div.textContent = "Nenhuma questão encontrada.";
    return;
  }

  lista.forEach(q => {
    const el = document.createElement("div");
    el.className = "questao";
    el.textContent =
      `Ano ${q.ano} | Nº ${q.numero} | Conteúdos: ${q.conteudos.join(", ")} | Gabarito: ${q.gabarito}`;
    div.appendChild(el);
  });
}
</script>

</body>
</html>
