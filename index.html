<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Filtro de Questões</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #eee;
            padding: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        select, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px 0;
            width: 100%;
        }

        button {
            cursor: pointer;
            margin-top: 10px;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 6px;
        }

        .questao {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>

<h1>Filtro de Questões</h1>

<label for="conteudos">Conteúdos (Ctrl para múltiplos):</label>
<select id="conteudos" multiple size="6">
    <option value="razão">Razão</option>
    <option value="proporção">Proporção</option>
    <option value="porcentagem">Porcentagem</option>
    <option value="estatística">Estatística</option>
    <option value="geometria">Geometria</option>
    <option value="função">Função</option>
</select>

<button onclick="filtrar()">Filtrar</button>

<div id="resultado"></div>

<script>
const questoes = [
    {
        ano: 2009,
        numero: 136,
        conteudos: ["razão", "proporção"],
        gabarito: "E"
    },
    {
        ano: 2009,
        numero: 140,
        conteudos: ["porcentagem", "proporção"],
        gabarito: "D"
    },
    {
        ano: 2010,
        numero: 141,
        conteudos: ["estatística"],
        gabarito: "B"
    },
    {
        ano: 2011,
        numero: 157,
        conteudos: ["geometria", "trigonometria"],
        gabarito: "B"
    },
    {
        ano: 2018,
        numero: 151,
        conteudos: ["probabilidade", "estatística", "multiplicação"],
        gabarito: "C"
    }
];

function filtrar() {
    const select = document.getElementById("conteudos");
    const selecionados = Array.from(select.selectedOptions).map(o => o.value);
    const resultado = document.getElementById("resultado");

    resultado.innerHTML = "";

    if (selecionados.length === 0) {
        resultado.innerHTML = "Selecione ao menos um conteúdo.";
        return;
    }

    const filtradas = questoes.filter(q =>
        selecionados.every(c => q.conteudos.includes(c))
    );

    if (filtradas.length === 0) {
        resultado.innerHTML = "Nenhuma questão encontrada.";
        return;
    }

    filtradas.forEach(q => {
        resultado.innerHTML += `
            <div class="questao">
                <strong>${q.ano} - Questão ${q.numero}</strong><br>
                Conteúdos: ${q.conteudos.join(", ")}<br>
                Gabarito: <strong>${q.gabarito}</strong>
            </div>
        `;
    });
}
</script>

</body>
</html>
